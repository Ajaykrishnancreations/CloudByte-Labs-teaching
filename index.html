<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>CloudByteLabs — Learn Technology From People Who Build With It</title>
    <meta
      name="description"
      content="Practical, industry-focused training in Salesforce, MERN Stack, UI/UX and Python — guided by experienced technology professionals."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cloudbytelabs-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
